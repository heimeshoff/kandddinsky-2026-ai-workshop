<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Household budget</title></head>
<body>
  <h1>Household budget</h1>
  <p>
    <button type="button" id="prev-month">Previous month</button>
    <strong id="month"></strong>
    <button type="button" id="next-month">Next month</button>
  </p>
  <p>Income: <strong id="income"></strong></p>
  <form id="income-form">
    <label>Income <input id="income-input" type="text" inputmode="decimal" autocomplete="off"></label>
    <button type="submit">Set income</button>
    <p id="income-error" role="alert"></p>
  </form>
  <h2>Categories</h2>
  <ul id="category-list"></ul>
  <form id="category-form">
    <label>Category <input id="category-input" type="text" autocomplete="off"></label>
    <button type="submit">Add category</button>
    <p id="category-error" role="alert"></p>
  </form>
  <h2>Expenses</h2>
  <p>Spent: <strong id="spent"></strong></p>
  <ul id="expense-list"></ul>
  <form id="expense-form">
    <label>Amount <input id="expense-amount" type="text" inputmode="decimal" autocomplete="off"></label>
    <label>Category <select id="expense-category"></select></label>
    <label>Date <input id="expense-date" type="date"></label>
    <label>Note <input id="expense-note" type="text" autocomplete="off"></label>
    <p id="expense-hint">Add a category first.</p>
    <button type="submit" id="expense-submit">Add expense</button>
    <p id="expense-error" role="alert"></p>
  </form>
  <script type="module" src="src/app.js"></script>
</body>
</html>
