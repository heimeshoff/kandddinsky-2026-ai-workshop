<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envelope</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f1; --surface: #ffffff; --sunk: #efeee9; --ink: #1d2521; --muted: #59645e;
    --line: #dcdbd4; --accent: #1f6f5c; --accent-ink: #ffffff; --accent-soft: #dcebe5;
    --neg: #b3261e; --neg-soft: #f8e4e1;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614; --surface: #1b211e; --sunk: #171c1a; --ink: #e6ebe7; --muted: #9da9a2;
      --line: #2e3733; --accent: #6cc3a8; --accent-ink: #0e1814; --accent-soft: #1c3a31;
      --neg: #ff8a7e; --neg-soft: #3b201d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.35 system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 40rem; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; }
  p { margin: 0; }
  .mono, .amount { font-family: var(--mono); }

  /* Month header */
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav strong { flex: 1; text-align: center; font-size: 26px; font-weight: 650; line-height: 1.15; }
  .month-nav button {
    width: 44px; height: 44px; flex: none; font-size: 20px; padding: 0;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
  }

  /* Stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tile > span:first-child { font-size: 13px; color: var(--muted); }
  .tile strong { font-family: var(--mono); font-size: 15px; font-weight: 650; letter-spacing: -.02em; white-space: nowrap; }
  .tile.neg strong { color: var(--neg); }
  .over-tag {
    display: none; align-self: flex-start; font-size: 13px; font-weight: 650; color: var(--neg);
    border: 1.5px solid var(--neg); border-radius: 4px; padding: 0 5px; text-transform: uppercase; letter-spacing: .04em;
  }
  .tile.neg .over-tag { display: inline-block; }

  /* Budget warning */
  #budget-warning {
    margin: 0; padding: 10px 16px 10px 32px; border: 1.5px solid var(--neg); border-radius: 8px;
    background: var(--neg-soft); color: var(--ink); font-size: 13px; font-weight: 650;
  }
  #budget-warning[hidden] { display: none; }
  #budget-warning li { padding: 2px 0; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card h2 {
    margin: 0; background: var(--sunk); padding: 10px 16px; font-size: 13px; font-weight: 650;
    text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .card h2 strong { font-family: var(--mono); font-size: 16px; color: var(--ink); text-transform: none; letter-spacing: 0; }
  .card form, .card .card-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows:empty { display: none; }
  .rows > li {
    border-top: 1px solid var(--line); padding: 8px 16px; min-height: 44px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  }
  .rows > li > button { flex: none; padding: 0 6px; }
  .rows > li:first-child { border-top: none; }
  .row-text { flex: 1 1 0; min-width: 0; }
  .row-text .name { font-weight: 650; }
  .row-text .amount { font-weight: 650; }
  .row-text .sub, .row-text .date { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .budget { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--muted); }
  .budget input { width: 96px; height: 36px; font-family: var(--mono); text-align: right; }
  .budget button { padding: 0 6px; }

  /* Form controls */
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 650; }
  input, select {
    height: 44px; padding: 0 12px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; font-weight: 400; outline: none; min-width: 0;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[inputmode=decimal] { font-family: var(--mono); }
  .rows input, .rows select { height: 40px; }
  .inline { display: flex; gap: 8px; align-items: flex-end; }
  .inline label { flex: 1; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  button {
    font: inherit; font-weight: 650; cursor: pointer; min-height: 36px; padding: 0 10px;
    border: none; border-radius: 8px; background: none; color: var(--accent);
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[type=submit] { min-height: 44px; padding: 0 16px; background: var(--accent); color: var(--accent-ink); }
  #expense-submit { min-height: 52px; }
  button:disabled { background: var(--sunk); color: var(--muted); cursor: not-allowed; }
  .rows button.del { color: var(--muted); }
  [role=alert] { font-size: 13px; font-weight: 650; color: var(--neg); }
  [role=alert]:empty { display: none; }
  .hint { font-size: 13px; color: var(--muted); }
  .hint[hidden] { display: none; }

  @media (max-width: 420px) {
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>Envelope</h1>
  <p class="month-nav">
    <button type="button" id="prev-month" aria-label="Previous month">‹</button>
    <strong id="month"></strong>
    <button type="button" id="next-month" aria-label="Next month">›</button>
  </p>

  <div class="tiles">
    <div class="tile"><span>Income</span><strong id="income"></strong></div>
    <div class="tile"><span>Spent</span><strong id="spent"></strong></div>
    <div class="tile" id="balance-tile"><span id="balance-label">Projected balance</span><strong id="balance"></strong><span class="over-tag">Over</span></div>
  </div>

  <ul id="budget-warning" role="alert" hidden></ul>

  <section class="card">
    <h2>Income</h2>
    <form id="income-form">
      <div class="inline">
        <label>Income <input id="income-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></label>
        <button type="submit">Set income</button>
      </div>
      <p id="income-error" role="alert"></p>
    </form>
  </section>

  <section class="card">
    <h2>Categories</h2>
    <ul id="category-list" class="rows"></ul>
    <form id="category-form">
      <div class="inline">
        <label>Category <input id="category-input" type="text" autocomplete="off" placeholder="Name"></label>
        <button type="submit">Add category</button>
      </div>
      <p id="category-error" role="alert"></p>
    </form>
  </section>

  <section class="card">
    <h2>Expenses</h2>
    <ul id="expense-list" class="rows"></ul>
    <form id="expense-form">
      <label>Amount <input id="expense-amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></label>
      <div class="grid2">
        <label>Category <select id="expense-category"></select></label>
        <label>Date <input id="expense-date" type="date"></label>
      </div>
      <label>Note <input id="expense-note" type="text" autocomplete="off"></label>
      <p id="expense-hint" class="hint">Add a category first.</p>
      <button type="submit" id="expense-submit">Add expense</button>
      <p id="expense-error" role="alert"></p>
    </form>
  </section>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
