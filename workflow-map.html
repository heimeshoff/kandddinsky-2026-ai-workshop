<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Map</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1b; --muted: #6a685f; --line: #d8d5cb;
    --lane-a: #fbfaf7; --lane-b: #f1efe8;
    --human: #b4541f; --human-bg: #fbeee5;
    --agent: #2c5d8f; --agent-bg: #e6eef8;
    --skill: #3b3a36; --skill-bg: #ffffff;
    --gate: #3d7a3a; --gate-bg: #e8f3e6;
    --art: #77756c; --art-bg: #f3f1ea;
    --fail: #b03a2e; --fail-bg: #fae8e5;
    --flow: #55534c;
    --l-task: #7b4cc0; --l-retry: #c0392b; --l-split: #0f8b8d;
    --l-clarify: #d0841b; --l-follow: #2f6fd0; --l-feedback: #c2408a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151513; --surface: #1f1e1b; --ink: #ecebe6; --muted: #a19f95; --line: #3a3934;
      --lane-a: #1b1a18; --lane-b: #22211e;
      --human: #f0a070; --human-bg: #3a2519; --agent: #8bb8e8; --agent-bg: #1b2a3a;
      --skill: #e2e0d8; --skill-bg: #262521; --gate: #8fcf8a; --gate-bg: #1c2f1b;
      --art: #b3b0a5; --art-bg: #2a2925; --fail: #f08f88; --fail-bg: #3a1d1b; --flow: #b9b6ab;
      --l-task: #b994f2; --l-retry: #f27a6c; --l-split: #4fd0d2;
      --l-clarify: #f2b45a; --l-follow: #7fb0ff; --l-feedback: #f28cc6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151513; --surface: #1f1e1b; --ink: #ecebe6; --muted: #a19f95; --line: #3a3934;
    --lane-a: #1b1a18; --lane-b: #22211e;
    --human: #f0a070; --human-bg: #3a2519; --agent: #8bb8e8; --agent-bg: #1b2a3a;
    --skill: #e2e0d8; --skill-bg: #262521; --gate: #8fcf8a; --gate-bg: #1c2f1b;
    --art: #b3b0a5; --art-bg: #2a2925; --fail: #f08f88; --fail-bg: #3a1d1b; --flow: #b9b6ab;
    --l-task: #b994f2; --l-retry: #f27a6c; --l-split: #4fd0d2;
    --l-clarify: #f2b45a; --l-follow: #7fb0ff; --l-feedback: #f28cc6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  svg { display: block; font-family: inherit; }
  #map { width: 100%; min-width: 980px; height: auto; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 0 0 14px; }
  .shape { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
  .shape i { display: inline-block; width: 22px; height: 14px; border: 2px solid; border-radius: 4px; }
  .s-human i { background: var(--human-bg); border-color: var(--human); border-radius: 7px; }
  .s-skill i { background: var(--skill-bg); border-color: var(--skill); border-radius: 9px; }
  .s-agent i { background: var(--agent-bg); border-color: var(--agent); }
  .s-gate  i { width: 13px; height: 13px; background: var(--gate-bg); border-color: var(--gate); transform: rotate(45deg); border-radius: 2px; margin: 0 4px; }
  .s-art   i { background: var(--art-bg); border-color: var(--art); border-style: solid; border-radius: 2px; }

  .loops { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px;
          border: 1.5px solid var(--c); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px;
          cursor: pointer; transition: background .15s; }
  .chip b { color: var(--c); }
  .chip span { color: var(--muted); }
  .chip .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
               background: var(--c); color: var(--surface); font-weight: 700; font-size: 13px; }
  .chip.line { border-style: dashed; }
  .chip:hover, .chip.on { background: color-mix(in srgb, var(--c) 14%, var(--surface)); }

  /* SVG styling */
  .lane-label .n { font-size: 30px; font-weight: 800; fill: var(--line); }
  .lane-label .t { font-size: 17px; font-weight: 700; fill: var(--ink); }
  .lane-label .w { font-size: 12px; fill: var(--muted); }
  .node text { pointer-events: none; }
  .lbl { font-size: 14px; font-weight: 650; fill: var(--ink); }
  .lbl.mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-weight: 600; font-size: 13.5px; }
  .note { font-size: 11px; fill: var(--muted); }
  .edge { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; transition: opacity .2s; }
  .edge.flow { stroke: var(--flow); }
  .edge.loop { stroke-width: 2.6; stroke-dasharray: 7 5; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -24; } }
  @media (prefers-reduced-motion: reduce) { .edge.loop { animation: none; } }
  .elbl { font-size: 11.5px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
  .badge circle { stroke: var(--surface); stroke-width: 2; }
  .badge text { font-size: 11px; font-weight: 800; fill: var(--surface); }
  .loop-g, .node { transition: opacity .2s; }
  svg.focus .loop-g:not(.hot), svg.focus .flow-g { opacity: .12; }
  svg.focus .node { opacity: .55; }

  .k-task { --c: var(--l-task); } .k-retry { --c: var(--l-retry); } .k-split { --c: var(--l-split); }
  .k-clarify { --c: var(--l-clarify); } .k-follow { --c: var(--l-follow); } .k-feedback { --c: var(--l-feedback); }
  .k-flow { --c: var(--flow); }

  .row2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 860px) { .row2 { grid-template-columns: 1fr; } }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 2px 4px 10px; }
  #board, #cast { width: 100%; height: auto; }
</style>
</head>
<body>
<main>
  <h1>Budget app — agent workflow</h1>
  <p class="sub">6 phases · 3 agents · 5 skills · 6 loops</p>

  <div class="card">
    <div class="bar">
      <span class="shape s-human"><i></i>Human</span>
      <span class="shape s-skill"><i></i>Skill /command</span>
      <span class="shape s-agent"><i></i>Agent</span>
      <span class="shape s-gate"><i></i>Decision</span>
      <span class="shape s-art"><i></i>File / folder</span>
    </div>
    <div class="scroll"><svg id="map" viewBox="0 0 1460 960" role="img" aria-label="Workflow swimlane diagram"></svg></div>
    <div class="loops" id="loops">
      <button class="chip line k-flow" data-loop="flow"><span class="dot">→</span><b>Main line</b><span>one way</span></button>
      <button class="chip k-task" data-loop="task"><span class="dot">1</span><b>Task loop</b><span>next ready task</span></button>
      <button class="chip k-retry" data-loop="retry"><span class="dot">2</span><b>Retry loop</b><span>FAIL → fix · max 2</span></button>
      <button class="chip k-split" data-loop="split"><span class="dot">3</span><b>Split loop</b><span>too big → subtasks</span></button>
      <button class="chip k-clarify" data-loop="clarify"><span class="dot">4</span><b>Clarify loop</b><span>questions → human</span></button>
      <button class="chip k-follow" data-loop="follow"><span class="dot">5</span><b>Follow-up loop</b><span>gaps → new tasks</span></button>
      <button class="chip k-feedback" data-loop="feedback"><span class="dot">6</span><b>Feedback loop</b><span>try app → change</span></button>
    </div>
  </div>

  <div class="row2">
    <div class="card">
      <h2>Task lifecycle = folder</h2>
      <div class="scroll"><svg id="board" viewBox="0 0 760 218" role="img" aria-label="Task folders"></svg></div>
    </div>
    <div class="card">
      <h2>Milestone status</h2>
      <div class="scroll"><svg id="cast" viewBox="0 0 520 210" role="img" aria-label="Milestone status"></svg></div>
    </div>
  </div>
</main>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  // Orthogonal path with rounded corners.
  function rpath(p, r) {
    r = r || 14;
    var d = 'M' + p[0][0] + ',' + p[0][1];
    for (var i = 1; i < p.length - 1; i++) {
      var a = p[i - 1], b = p[i], c = p[i + 1];
      var l1 = Math.hypot(b[0] - a[0], b[1] - a[1]), l2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
      var rr = Math.min(r, l1 / 2, l2 / 2);
      var p1 = [b[0] - (b[0] - a[0]) / l1 * rr, b[1] - (b[1] - a[1]) / l1 * rr];
      var p2 = [b[0] + (c[0] - b[0]) / l2 * rr, b[1] + (c[1] - b[1]) / l2 * rr];
      d += ' L' + p1[0] + ',' + p1[1] + ' Q' + b[0] + ',' + b[1] + ' ' + p2[0] + ',' + p2[1];
    }
    var z = p[p.length - 1];
    return d + ' L' + z[0] + ',' + z[1];
  }
  function markers(svg, kinds) {
    var defs = el('defs', {}, svg);
    kinds.forEach(function (k) {
      var m = el('marker', { id: svg.id + '-arr-' + k, viewBox: '0 0 10 10', refX: 8.5, refY: 5,
        markerWidth: 5.5, markerHeight: 5.5, orient: 'auto-start-reverse' }, defs);
      el('path', { d: 'M0,0 L10,5 L0,10 z', style: 'fill:var(' + (k === 'flow' ? '--flow' : '--l-' + k) + ')' }, m);
    });
  }

  // ---------- node shapes ----------
  function icon(g, type, x, y) {
    if (type === 'human') {
      el('circle', { cx: x, cy: y - 5, r: 5, fill: 'var(--human)' }, g);
      el('path', { d: 'M' + (x - 9) + ',' + (y + 11) + ' a9,8 0 0 1 18,0 z', fill: 'var(--human)' }, g);
    } else if (type === 'agent') {
      el('rect', { x: x - 10, y: y - 8, width: 20, height: 17, rx: 5, fill: 'var(--agent)' }, g);
      el('line', { x1: x, y1: y - 8, x2: x, y2: y - 13, stroke: 'var(--agent)', 'stroke-width': 2 }, g);
      el('circle', { cx: x, cy: y - 14, r: 2.2, fill: 'var(--agent)' }, g);
      el('circle', { cx: x - 4, cy: y, r: 2.2, fill: 'var(--agent-bg)' }, g);
      el('circle', { cx: x + 4, cy: y, r: 2.2, fill: 'var(--agent-bg)' }, g);
    }
  }
  function node(svg, n) {
    var g = el('g', { class: 'node' }, svg);
    if (n.tip) el('title', {}, g, n.tip);
    var x = n.x, y = n.y, w = n.w || 130, h = n.h || 58;
    if (n.type === 'human' || n.type === 'agent') {
      var c = n.type === 'human' ? '--human' : '--agent';
      el('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: n.type === 'human' ? 22 : 10,
        fill: 'var(' + c + '-bg)', stroke: 'var(' + c + ')', 'stroke-width': 2 }, g);
      icon(g, n.type, x - w / 2 + 22, y + (n.sub ? 0 : 0));
      el('text', { x: x - w / 2 + 40, y: n.sub ? y - 2 : y + 5, class: 'lbl' }, g, n.label);
      if (n.sub) el('text', { x: x - w / 2 + 40, y: y + 14, class: 'note' }, g, n.sub);
    } else if (n.type === 'skill') {
      w = n.w || 140; h = 30;
      el('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 15,
        fill: 'var(--skill-bg)', stroke: 'var(--skill)', 'stroke-width': 1.8 }, g);
      el('text', { x: x, y: y + 5, 'text-anchor': 'middle', class: 'lbl mono' }, g, n.label);
    } else if (n.type === 'gate') {
      var s = n.s || 36;
      el('polygon', { points: [x, y - s, x + s, y, x, y + s, x - s, y].join(' '),
        fill: 'var(--gate-bg)', stroke: 'var(--gate)', 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
      el('text', { x: x, y: y + 4.5, 'text-anchor': 'middle', class: 'lbl', style: 'font-size:12.5px' }, g, n.label);
      if (n.sub) el('text', { x: x, y: y + s + 15, 'text-anchor': 'middle', class: 'note' }, g, n.sub);
    } else if (n.type === 'doc') {
      w = n.w || 82; h = n.h || 54;
      var L = x - w / 2, T = y - h / 2, f = 12;
      el('path', { d: 'M' + L + ',' + T + ' h' + (w - f) + ' l' + f + ',' + f + ' v' + (h - f) + ' h' + (-w) + ' z',
        fill: 'var(--art-bg)', stroke: 'var(--art)', 'stroke-width': 1.8, 'stroke-linejoin': 'round' }, g);
      el('path', { d: 'M' + (L + w - f) + ',' + T + ' v' + f + ' h' + f, fill: 'none', stroke: 'var(--art)', 'stroke-width': 1.5 }, g);
      for (var i = 0; i < 2; i++) el('line', { x1: L + 10, x2: L + w - 18, y1: T + 14 + i * 7, y2: T + 14 + i * 7, stroke: 'var(--line)', 'stroke-width': 2 }, g);
      el('text', { x: x, y: T + h - 9, 'text-anchor': 'middle', class: 'lbl mono', style: 'font-size:11.5px' }, g, n.label);
    } else if (n.type === 'folder') {
      w = n.w || 104; h = n.h || 50;
      var col = n.tone === 'fail' ? '--fail' : n.tone === 'gate' ? '--gate' : '--art';
      var L2 = x - w / 2, T2 = y - h / 2;
      el('path', { d: 'M' + L2 + ',' + (T2 + 6) + ' v' + (h - 6) + ' h' + w + ' v' + (h - 12) * -1 + ' h' + (-(w - 40)) +
        ' l-6,-6 h-28 z', transform: '', fill: 'var(' + col + (col === '--art' ? '-bg' : '-bg') + ')',
        stroke: 'var(' + col + ')', 'stroke-width': 1.8, 'stroke-linejoin': 'round' }, g);
      el('text', { x: x, y: y + 9, 'text-anchor': 'middle', class: 'lbl mono' }, g, n.label);
    } else if (n.type === 'pill') {
      w = n.w || 110; h = 24;
      var pc = n.tone === 'gate' ? '--gate' : '--art';
      el('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 12, fill: 'var(' + pc + '-bg)', stroke: 'var(' + pc + ')', 'stroke-width': 1.6 }, g);
      el('text', { x: x, y: y + 4.5, 'text-anchor': 'middle', class: 'lbl', style: 'font-size:12px' }, g, n.label);
    } else if (n.type === 'group') {
      el('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx: 14, fill: 'none', stroke: 'var(--line)', 'stroke-width': 1.6, 'stroke-dasharray': '4 4' }, g);
    }
    return g;
  }
  function edge(svg, e) {
    var loop = e.k !== 'flow';
    var g = el('g', { class: loop ? 'loop-g' : 'flow-g', 'data-loop': e.k }, svg);
    el('path', { d: rpath(e.p, e.r), class: 'edge ' + (loop ? 'loop' : 'flow'),
      style: loop ? 'stroke:var(--l-' + e.k + ')' : '', 'marker-end': 'url(#' + svg.id + '-arr-' + e.k + ')' }, g);
    if (e.label) {
      el('text', { x: e.lx, y: e.ly, 'text-anchor': e.a || 'middle', class: 'elbl',
        style: 'fill:var(' + (loop ? '--l-' + e.k : '--flow') + ')' }, g, e.label);
    }
    if (e.badge) {
      var b = el('g', { class: 'badge' }, g);
      el('circle', { cx: e.badge[0], cy: e.badge[1], r: 11, style: 'fill:var(--l-' + e.k + ')' }, b);
      el('text', { x: e.badge[0], y: e.badge[1] + 4, 'text-anchor': 'middle' }, b, e.badge[2]);
    }
    return g;
  }

  // ---------- main swimlane map ----------
  var map = document.getElementById('map');
  markers(map, ['flow', 'task', 'retry', 'split', 'clarify', 'follow', 'feedback']);

  var lanes = [
    { n: '1', t: 'Intent',  w: 'human' },
    { n: '2', t: 'Plan',    w: 'planner' },
    { n: '3', t: 'Build',   w: 'implementer' },
    { n: '4', t: 'Verify',  w: 'tester' },
    { n: '5', t: 'Ratify',  w: 'conductor' },
    { n: '6', t: 'Accept',  w: 'tester + human' }
  ];
  var TOP = 40, LH = 150;
  lanes.forEach(function (l, i) {
    var y = TOP + i * LH;
    el('rect', { x: 0, y: y, width: 1460, height: LH, fill: i % 2 ? 'var(--lane-b)' : 'var(--lane-a)' }, map);
    el('line', { x1: 0, x2: 1460, y1: y, y2: y, stroke: 'var(--line)' }, map);
    var g = el('g', { class: 'lane-label' }, map);
    el('text', { x: 18, y: y + 86, class: 'n' }, g, l.n);
    el('text', { x: 46, y: y + 72, class: 't' }, g, l.t);
    el('text', { x: 46, y: y + 92, class: 'w' }, g, l.w);
  });
  el('line', { x1: 0, x2: 1460, y1: TOP + 6 * LH, y2: TOP + 6 * LH, stroke: 'var(--line)' }, map);
  el('line', { x1: 160, x2: 160, y1: TOP, y2: TOP + 6 * LH, stroke: 'var(--line)' }, map);

  var E = [
    // main line
    { k: 'flow', p: [[266, 115], [318, 115]] },
    { k: 'flow', p: [[385, 144], [385, 220]], label: 'describe', lx: 393, ly: 190, a: 'start' },
    { k: 'flow', p: [[467, 265], [523, 265]] },
    { k: 'flow', p: [[657, 265], [721, 265]] },
    { k: 'flow', p: [[775, 291], [775, 377]] },
    { k: 'flow', p: [[700, 415], [737, 415]] },
    { k: 'flow', p: [[813, 415], [883, 415]] },
    { k: 'flow', p: [[950, 446], [950, 532]], label: 'DONE', lx: 958, ly: 494, a: 'start' },
    { k: 'flow', p: [[1017, 565], [1072, 565]] },
    { k: 'flow', p: [[1110, 603], [1110, 688]], label: 'PASS', lx: 1118, ly: 650, a: 'start' },
    { k: 'flow', p: [[1162, 715], [1199, 715]] },
    { k: 'flow', p: [[1281, 715], [1310, 715]] },
    { k: 'flow', p: [[1110, 742], [1110, 832]], label: 'all tasks done', lx: 1118, ly: 790, a: 'start' },
    { k: 'flow', p: [[1177, 865], [1232, 865]] },
    { k: 'flow', p: [[1308, 865], [1432, 865], [1432, 115], [1407, 115]], label: 'PASS', lx: 1424, ly: 560, a: 'end' },
    { k: 'flow', p: [[1340, 144], [1340, 159]] },
    // loops
    { k: 'task', p: [[1058, 715], [775, 715], [775, 453]], label: 'next task', lx: 900, ly: 707, badge: [790, 640, '1'] },
    { k: 'retry', p: [[1110, 527], [1110, 425], [1017, 425]], label: 'FAIL · max 2', lx: 1102, ly: 478, a: 'end', badge: [1124, 478, '2'] },
    { k: 'split', p: [[930, 384], [930, 322], [805, 322], [805, 292]], label: 'SPLIT', lx: 868, ly: 314, badge: [945, 352, '3'] },
    { k: 'clarify', p: [[992, 384], [992, 362], [1150, 362], [1150, 105], [1112, 105]], label: 'NEEDS_INPUT', lx: 1070, ly: 355 },
    { k: 'clarify', p: [[1146, 565], [1192, 565], [1192, 130], [1112, 130]], label: '3× FAIL', lx: 1200, ly: 470, a: 'start' },
    { k: 'clarify', p: [[1060, 142], [1060, 248]], label: 'answer', lx: 1068, ly: 200, a: 'start', badge: [1046, 200, '4'] },
    { k: 'clarify', p: [[998, 265], [827, 265]] },
    { k: 'clarify', p: [[590, 234], [590, 128], [472, 128]], label: 'questions', lx: 598, ly: 182, a: 'start', badge: [578, 182, '4'] },
    { k: 'follow', p: [[1270, 903], [1270, 922], [560, 922], [560, 296]], label: 'FAIL · follow-up tasks', lx: 900, ly: 914, badge: [575, 600, '5'] },
    { k: 'feedback', p: [[1340, 86], [1340, 56], [385, 56], [385, 84]], label: 'feedback → /add-task', lx: 860, ly: 50, badge: [700, 56, '6'] }
  ];
  E.forEach(function (e) { edge(map, e); });

  var N = [
    { type: 'doc', x: 225, y: 115, label: 'purpose.md', w: 84, tip: 'Why the app exists, domain rules, vocabulary. Written once.' },
    { type: 'human', x: 395, y: 115, w: 150, label: 'Human', sub: 'milestone · change', tip: 'Describes a milestone or a single change.' },
    { type: 'folder', x: 1060, y: 115, label: 'blocked/', tone: 'fail', tip: 'Needs the human: open questions or 3 failed tester rounds.' },
    { type: 'human', x: 1340, y: 115, w: 130, label: 'Try app', sub: 'index.html', tip: 'Open app/index.html and try it.' },
    { type: 'pill', x: 1340, y: 172, w: 92, label: 'closed ✓', tone: 'gate', tip: 'Human closes the milestone.' },
    { type: 'group', x: 305, y: 222, w: 160, h: 88 },
    { type: 'skill', x: 385, y: 246, label: '/plan-milestone', tip: 'Milestone → milestone file + tasks.' },
    { type: 'skill', x: 385, y: 288, label: '/add-task', tip: 'One change → one task, no milestone.' },
    { type: 'agent', x: 590, y: 265, label: 'planner', sub: 'task files', tip: 'Cuts small, vertical, testable tasks.' },
    { type: 'folder', x: 775, y: 265, label: 'backlog/', tip: 'Tasks waiting; ready when all depends_on are done.' },
    { type: 'skill', x: 1060, y: 265, w: 120, label: '/unblock', tip: 'Human guidance appended, attempts reset, back to backlog.' },
    { type: 'skill', x: 660, y: 415, w: 80, label: '/build', tip: 'The conductor: runs everything without asking.' },
    { type: 'gate', x: 775, y: 415, label: 'ready?', tip: 'Picks the ready task with the lowest id. One at a time.' },
    { type: 'agent', x: 950, y: 415, w: 134, label: 'implementer', sub: 'red → green', tip: 'Test-first until npm test is green. DONE / SPLIT / NEEDS_INPUT.' },
    { type: 'agent', x: 950, y: 565, w: 134, label: 'tester', sub: 'fresh eyes', tip: 'Independent: checks every AC, probes like a user.' },
    { type: 'gate', x: 1110, y: 565, label: 'PASS?', tip: 'PASS only if every criterion is met and npm test is green.' },
    { type: 'folder', x: 1110, y: 715, label: 'done/', tone: 'gate', tip: 'Ratified task.' },
    { type: 'doc', x: 1240, y: 715, label: 'CHANGELOG', w: 82, tip: 'One line per ratified task.' },
    { type: 'pill', x: 1360, y: 715, w: 96, label: 'git commit', tip: 'task NNN: <title>' },
    { type: 'agent', x: 1110, y: 865, w: 134, label: 'tester', sub: 'milestone e2e', tip: 'End-to-end check of the story and every "Done when".' },
    { type: 'gate', x: 1270, y: 865, label: 'PASS?', tip: 'Milestone acceptance.' }
  ];
  N.forEach(function (n) { node(map, n); });

  // Loop highlight
  var chips = document.querySelectorAll('.chip');
  function focus(k) {
    map.classList.toggle('focus', !!k);
    map.querySelectorAll('.loop-g, .flow-g').forEach(function (g) {
      g.classList.toggle('hot', g.getAttribute('data-loop') === k);
      if (k === 'flow') g.style.opacity = g.getAttribute('data-loop') === 'flow' ? 1 : '';
      else g.style.opacity = '';
    });
    chips.forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-loop') === k); });
  }
  var pinned = null;
  chips.forEach(function (c) {
    var k = c.getAttribute('data-loop');
    c.addEventListener('mouseenter', function () { focus(k); });
    c.addEventListener('mouseleave', function () { focus(pinned); });
    c.addEventListener('click', function () { pinned = pinned === k ? null : k; focus(pinned); });
  });

  // ---------- task lifecycle (folders) ----------
  var b = document.getElementById('board');
  markers(b, ['flow', 'retry', 'clarify', 'split']);
  [
    { k: 'flow', p: [[130, 70], [188, 70]] },
    { k: 'flow', p: [[318, 70], [376, 70]], label: 'DONE', lx: 347, ly: 60 },
    { k: 'flow', p: [[506, 70], [564, 70]], label: 'PASS', lx: 535, ly: 60 },
    { k: 'retry', p: [[425, 98], [425, 118], [270, 118], [270, 99]], label: 'FAIL', lx: 347, ly: 134 },
    { k: 'split', p: [[220, 42], [220, 22], [65, 22], [65, 41]], label: 'subtasks', lx: 142, ly: 16 },
    { k: 'clarify', p: [[236, 98], [236, 170], [300, 170]] },
    { k: 'clarify', p: [[462, 98], [462, 170], [404, 170]] },
    { k: 'clarify', p: [[352, 192], [352, 204], [65, 204], [65, 100]], label: '/unblock', lx: 160, ly: 198 }
  ].forEach(function (e) { edge(b, e); });
  // Drawn after the edges so folders sit on top.
  [
    { x: 65, label: 'backlog/' }, { x: 253, label: 'doing/' }, { x: 441, label: 'review/' },
    { x: 629, label: 'done/', tone: 'gate' }
  ].forEach(function (f) { node(b, { type: 'folder', x: f.x, y: 70, w: 120, h: 56, label: f.label, tone: f.tone }); });
  node(b, { type: 'folder', x: 352, y: 170, w: 100, h: 44, label: 'blocked/', tone: 'fail' });
  node(b, { type: 'skill', x: 629, y: 150, w: 100, label: '/status', tip: 'Shows the board. Changes nothing.' });
  el('text', { x: 629, y: 182, 'text-anchor': 'middle', class: 'note' }, b, 'reads every folder');

  // ---------- milestone status ----------
  var m = document.getElementById('cast');
  markers(m, ['flow', 'follow']);
  var st = [
    { x: 60, label: 'planned', who: '/plan-milestone' },
    { x: 190, label: 'in-progress', who: '/build' },
    { x: 330, label: 'accepted', who: 'tester' },
    { x: 460, label: 'closed', who: 'human', tone: 'gate' }
  ];
  [
    { k: 'flow', p: [[112, 90], [136, 90]] },
    { k: 'flow', p: [[246, 90], [272, 90]] },
    { k: 'flow', p: [[388, 90], [408, 90]] },
    { k: 'follow', p: [[330, 112], [330, 150], [190, 150], [190, 114]], label: 'FAIL → follow-up', lx: 260, ly: 168 }
  ].forEach(function (e) { edge(m, e); });
  st.forEach(function (s) {
    var w = s.label.length * 8.5 + 26;
    node(m, { type: 'pill', x: s.x, y: 90, w: w, label: s.label, tone: s.tone });
    el('text', { x: s.x, y: 60, 'text-anchor': 'middle', class: 'note', style: 'font-family:ui-monospace,Consolas,monospace' }, m, s.who);
  });
})();
