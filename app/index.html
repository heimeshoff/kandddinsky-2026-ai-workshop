<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1 data-testid="app-title">Budget</h1>

    <section class="categories" aria-labelledby="categories-heading">
      <h2 id="categories-heading">Categories</h2>

      <form class="category-form" data-testid="category-form" novalidate>
        <label>
          <span>Name</span>
          <input type="text" data-testid="category-name-input" placeholder="e.g. Groceries" autocomplete="off">
        </label>
        <label>
          <span>Budgeted amount (€ per month)</span>
          <input type="text" inputmode="decimal" data-testid="category-budget-input" placeholder="e.g. 300" autocomplete="off">
        </label>
        <button type="submit" data-testid="category-add-button">Add category</button>
      </form>
      <p class="form-error" data-testid="category-error" role="alert" hidden></p>

      <p class="empty" data-testid="category-empty">No categories yet</p>
      <table class="category-table" data-testid="category-table">
        <thead>
          <tr><th scope="col">Category</th><th scope="col" class="amount">Budgeted</th></tr>
        </thead>
        <tbody data-testid="category-list"></tbody>
      </table>
    </section>
  </main>
  <script src="domain.js"></script>
  <script src="ui.js"></script>
</body>
</html>
